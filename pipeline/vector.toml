[sources.otel_inbound]
type = "opentelemetry"
address = "0.0.0.0:4317"

[transforms.stream_filter]
type = "filter"
inputs = ["otel_inbound"]
# Drop healthy 200-OK trace spans to save 80% network bandwidth, retain all anomalies & GenAI errors
condition = '.status_code != 200 || .anomaly_flag == true || exists(.gen_ai)'

[sinks.clickhouse_columnar]
type = "clickhouse"
inputs = ["stream_filter"]
endpoint = "http://clickhouse.monitoring.svc.cluster.local:8123"
database = "nexus"
table = "telemetry_streams"
auth.strategy = "basic"
auth.user = "default"
auth.password = "securepassword"
batch.max_bytes = 10485760
batch.timeout_secs = 1