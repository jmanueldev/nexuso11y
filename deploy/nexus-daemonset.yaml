apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nexuso11y-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: nexuso11y
spec:
  selector:
    matchLabels:
      name: nexuso11y-agent
  template:
    metadata:
      labels:
        name: nexuso11y-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: nexus-collector
        image: ghcr.io/nexuso11y/agent:latest
        securityContext:
          privileged: true
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
        ports:
          - containerPort: 4318
            hostPort: 4318
            name: otlp-http